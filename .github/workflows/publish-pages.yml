name: Update and publish job radar

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 18:15 UTC = 次日 02:15 北京时间。GitHub 的定时触发可能有延迟。
    - cron: "15 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Fetch public events and build the page
        run: python -X utf8 scrape_hrbeu.py --delay 0.35

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
