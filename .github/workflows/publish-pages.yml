name: Update and publish job radar

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 18:15 UTC = 次日 02:15 北京时间。GitHub 的定时触发可能有延迟。
    - cron: "15 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 学校站点在 GitHub runner 上可能优先解析到不可用的 IPv6 路由。
      HRBEU_FORCE_IPV4: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Fetch public events and build the page
        id: school_fetch
        continue-on-error: true
        run: python -X utf8 scrape_hrbeu.py --delay 0.35

      - name: Publish UI changes with saved events when school is unavailable
        if: steps.school_fetch.outcome == 'failure' && github.event_name == 'push'
        run: |
          echo "::warning::School refresh failed. Publishing saved events with original timestamp and a visible warning."
          python -X utf8 scrape_hrbeu.py --from-snapshot

      - name: Keep existing website when scheduled refresh fails
        if: steps.school_fetch.outcome == 'failure' && github.event_name != 'push'
        run: |
          echo "::error::School refresh failed; keeping the existing public website unchanged."
          exit 1

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
