name: Update and publish job radar

on:
  workflow_dispatch:
    inputs:
      test_fallback:
        description: 'Skip primary fetch to verify the Windows fallback with real school data'
        type: boolean
        default: false
  push:
    branches: [main]
  schedule:
    # 北京时间 09:35 / 17:35，避开近期连续连接超时的凌晨时段。
    # GitHub 定时任务可能排队延迟。
    - cron: "35 1,9 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    env:
      # 学校站点在 GitHub runner 上可能优先解析到不可用的 IPv6 路由。
      HRBEU_FORCE_IPV4: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Fetch public events and build the page
        id: school_fetch
        if: ${{ !inputs.test_fallback }}
        run: python -u -X utf8 scrape_hrbeu.py --delay 0.35

      - name: Save freshly fetched page
        id: upload
        if: steps.school_fetch.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: school-primary
          path: index.html
          if-no-files-found: error
          retention-days: 3

  fallback:
    needs: build
    if: ${{ always() && !cancelled() && needs.build.outputs.artifact == '' }}
    runs-on: windows-latest
    timeout-minutes: 8
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    env:
      HRBEU_FORCE_IPV4: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Retry public fetch on independent Windows runner
        run: python -u -X utf8 scrape_hrbeu.py --delay 0.35
      - name: Save freshly fetched backup page
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: school-fallback
          path: index.html
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [build, fallback]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Keep existing website when scheduled refresh fails
        if: needs.build.outputs.artifact == '' && needs.fallback.outputs.artifact == '' && github.event_name != 'push'
        run: |
          echo "::error::Both school fetch routes failed. No fresh data; existing website is unchanged."
          exit 1

      - name: Download successfully fetched data
        if: needs.build.outputs.artifact != '' || needs.fallback.outputs.artifact != ''
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.artifact != '' && 'school-primary' || 'school-fallback' }}
          path: _site

      - name: Publish UI-only changes with an explicit stale-data warning
        if: needs.build.outputs.artifact == '' && needs.fallback.outputs.artifact == '' && github.event_name == 'push'
        run: |
          echo "::warning::Both school fetch routes failed. Using committed snapshot with its ORIGINAL timestamp."
          mkdir -p _site
          python -X utf8 scrape_hrbeu.py --from-snapshot --output _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: ${{ always() && !cancelled() && needs.publish.result == 'success' }}
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
